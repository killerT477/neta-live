# Daily: read today's political headlines, write satirical posts + India events, publish events.json.
# Cost: $0 (public repo = free Actions minutes; Gemini free tier; GitHub Pages free).
# Pause: Settings -> Secrets and variables -> Actions -> Variables -> add SIDECAR_PAUSED = 1
#        (or Actions tab -> "Refresh live feed" -> ... -> Disable workflow).
name: Refresh live feed

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 07:00 IST / 20:30 US Eastern, once a day
  workflow_dispatch: {}     # "Run workflow" button for a manual run

permissions:
  contents: write           # commit the updated events.json

concurrency:
  group: refresh-live-feed
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.SIDECAR_PAUSED != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node sidecar/refresh.mjs
      - name: Check the feed is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('events.json','utf8'))"
      - name: Publish
        run: |
          if git diff --quiet events.json; then echo "No changes."; exit 0; fi
          git config user.name "neta-live-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Auto feed $(date -u +%Y-%m-%d)"
          git push
